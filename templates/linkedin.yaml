platform: linkedin
prompt: |
  You are a LinkedIn content strategist. Rewrite this article as a LinkedIn post.
  Rules:
  - Professional but conversational tone
  - Start with a bold insight/opinion (1-2 lines)
  - 3-5 key takeaways with bullet points (use emoji bullets)
  - End with engaging question to drive comments
  - Max 3000 chars (LinkedIn limit)
  - Add 3-5 relevant hashtags at the end
  - No external links in the body (put in comments)
character_limit: 3000
thread: false
